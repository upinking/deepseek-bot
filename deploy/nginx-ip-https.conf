# 部署前将文档示例 IP 203.0.113.10 替换为你的服务器公网 IP。
server {
    listen 80;
    server_name 203.0.113.10;
    location ^~ /.well-known/acme-challenge/ { root /var/www/deepseek-bot-acme; }
    location / { return 301 https://203.0.113.10$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 203.0.113.10;
    ssl_certificate /etc/deepseek-bot-tls/certs/live/deepseek-bot-ip/fullchain.pem;
    ssl_certificate_key /etc/deepseek-bot-tls/certs/live/deepseek-bot-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/deepseek-bot.conf;
    location = / { return 302 /deepseek/; }
    location / { return 404; }
}
