<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="你的私人 Bot 工作台。聊天、记忆和例行任务，在电脑和手机之间继续。">
  <title>DeepSeek Bot</title>
  <link rel="icon" href="./assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=20">
  <script src="./app.js?v=20" defer></script>
</head>
<body>
  <div id="connection-banner" class="connection-banner hidden" role="status"></div>
  <section id="auth-screen" class="auth-screen">
    <div class="auth-story" aria-hidden="true">
      <div class="brand"><img src="./assets/icon.png" alt=""><span>DeepSeek Bot</span></div>
      <div class="auth-art"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><img src="./assets/icon.png" alt=""></div>
      <div class="auth-story-text"><span class="eyebrow">你的私人工作台</span><h1>与 Bot 对话，<br>在云端完成任务。</h1><p>在电脑和手机上查看聊天、记忆<br>和例行任务。</p></div>
    </div>
    <div class="auth-main">
      <div class="auth-card">
        <div class="mobile-brand brand"><img src="./assets/icon.png" alt=""><span>DeepSeek Bot</span></div>
        <span class="eyebrow">私人工作台</span>
        <h2 id="auth-title">欢迎回来</h2>
        <p id="auth-description">输入工作台密码，继续你的对话。</p>
        <form id="auth-form" method="post">
          <label class="field"><span>工作台密码</span><input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="输入登录密码" required></label>
          <p id="auth-error" class="form-error hidden" role="alert"></p>
          <button id="auth-submit" class="button primary wide" type="submit">登录工作台 <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-footnote">个人使用 · 记录由你的服务器保存</p>
        <button id="auth-retry" class="button subtle hidden" type="button">重新连接</button>
      </div>
    </div>
  </section>
  <div id="app" class="app hidden">
    <button id="sidebar-scrim" class="scrim hidden" aria-label="关闭联系人列表"></button>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top"><div class="brand"><img src="./assets/icon.png" alt=""><span>DeepSeek Bot</span></div><button id="sidebar-close" class="icon-button mobile-only" aria-label="关闭联系人列表"></button></div>
      <div class="sidebar-tools"><label class="search-box"><span id="search-icon"></span><input id="contact-search" type="search" placeholder="搜索联系人或群聊" aria-label="搜索联系人或群聊"></label><button id="new-contact" class="icon-button outlined" title="新建 Bot 或群聊" aria-label="新建 Bot 或群聊"></button></div>
      <div id="primary-contact"></div>
      <nav id="contact-list" class="contact-list" aria-label="联系人和群聊"></nav>
      <div id="account-area" class="sidebar-bottom account-area">
        <div id="account-menu" class="account-menu hidden" role="menu" aria-label="账户菜单"></div>
        <button id="account-button" class="account-button" type="button" aria-label="打开账户菜单" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu"></button>
        <span id="sidebar-work-count" class="sr-only"></span>
      </div>
    </aside>
    <main class="chat-panel">
      <header class="chat-header">
        <button id="sidebar-open" class="icon-button sidebar-toggle" aria-label="打开联系人列表"></button>
        <div id="conversation-heading" class="conversation-heading"></div>
        <div class="header-actions"><button id="tasks-open" class="button subtle compact" aria-label="任务记录"><span id="tasks-icon"></span><span class="button-label">任务</span><span id="tasks-count" class="tiny-count hidden"></span></button><button id="conversation-more" class="icon-button" aria-label="对话设置" title="对话设置"></button></div>
      </header>
      <div id="config-banner" class="notice-banner hidden"><span>连接 DeepSeek 后，Bot 才能开始回答和执行任务。</span><button id="connect-model" class="text-button">去连接</button></div>
      <div id="activity-bar" class="activity-bar hidden"></div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="聊天记录"></div>
      <div class="composer-area">
        <div id="pending-files" class="pending-files hidden"></div>
        <form id="composer" class="composer" method="post">
          <label class="icon-button attach-button" title="上传文件"><span id="attach-icon"></span><span class="sr-only">上传文件</span><input id="composer-files" type="file" multiple class="sr-only"></label>
          <textarea id="message-input" rows="1" aria-label="消息内容" placeholder="发送消息，或交给 Bot 一个任务…"></textarea>
          <button id="send-button" class="send-button" type="submit" aria-label="发送消息"></button>
        </form>
        <div class="composer-meta"><select id="speaker-select" aria-label="选择回复的 Bot" class="hidden"></select><span>Enter 发送 · Shift + Enter 换行</span><span id="sync-label">记录保存在云端</span></div>
      </div>
    </main>
  </div>
  <dialog id="modal" class="modal"><header class="modal-header"><div><span id="modal-eyebrow" class="eyebrow">WORKSPACE</span><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-button" aria-label="关闭对话框"></button></header><div id="modal-body" class="modal-body"></div></dialog>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
</body>
</html>
